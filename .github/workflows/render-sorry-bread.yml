name: Render Sorry-Bread Short (GitHub Actions)

on:
  workflow_dispatch:
  push:
    branches: [main, render/sorry-bread]
    paths:
      - 'roblox-shorts/**'
      - '.github/workflows/render-sorry-bread.yml'

concurrency:
  group: sorry-bread-render
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.segments.outputs.matrix }}
      dur: ${{ steps.segments.outputs.dur }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: roblox-shorts/package-lock.json

      - name: Install browser system libraries
        run: |
          sudo apt-get update -qq
          ALSA=$(apt-cache show libasound2t64 >/dev/null 2>&1 && echo libasound2t64 || echo libasound2)
          sudo apt-get install -y -qq \
            libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$ALSA" \
            libxss1 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libcups2 libdrm2 ffmpeg

      - name: Install render packages
        working-directory: roblox-shorts
        run: npm ci --no-audit --no-fund

      - name: Ensure Chrome for Puppeteer
        working-directory: roblox-shorts
        run: npx puppeteer browsers install chrome

      - name: Check script and places
        working-directory: roblox-shorts
        run: node render.mjs check

      - name: Preflight frame check (fail fast on framing/clipping/pop-ins)
        working-directory: roblox-shorts
        run: |
          TIMES=$(node -e '
            const t = require("./voice/timing.json");
            const lines = t.lines ?? t;
            const xs = [];
            for (const l of lines) {
              const s = l.start ?? l.begin ?? 0, e = l.end ?? (s + (l.dur ?? 0));
              if (s > 0.05) xs.push(s - 0.17);
              xs.push(s + 0.15, (s + e) / 2, e - 0.15);
            }
            console.log([...new Set(xs.map((x) => Math.max(0, x).toFixed(2)))].join(","));
          ')
          node render.mjs stills "$TIMES" > preflight.log 2>&1 || true
          if grep -Eq 'ISSUE|CLIP|REFUSED' preflight.log; then
            tail -120 preflight.log
            exit 1
          fi
          echo "Preflight clean: no framing, clipping or pop-in issues."

      - name: Compute render segments (frame-aligned, 1080x1920 full duration)
        id: segments
        working-directory: roblox-shorts
        run: |
          node -e '
            const t = require("./voice/timing.json");
            const lines = t.lines ?? t;
            const dur = t.duration ?? lines[lines.length - 1].end;
            const FPS = 24, N = Math.round(dur * FPS);
            const n = dur >= 58 ? 4 : 3;
            const out = [];
            for (let i = 0; i < n; i++) {
              const a = Math.round(N * i / n), b = Math.round(N * (i + 1) / n);
              if (b > a) out.push({ seg: i, from: +(a / FPS).toFixed(3), to: +(b / FPS).toFixed(3) });
            }
            console.log("DUR=" + dur.toFixed(3));
            console.log("MATRIX=" + JSON.stringify(out));
          ' | tee /tmp/segments.txt
          DURV=$(grep '^DUR=' /tmp/segments.txt | cut -d= -f2)
          MATRIX=$(grep '^MATRIX=' /tmp/segments.txt | cut -d= -f2-)
          echo "dur=$DURV" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        seg: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      FK_HISTORY: ${{ github.workspace }}/roblox-shorts/history.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: roblox-shorts/package-lock.json

      - name: Install browser system libraries
        run: |
          sudo apt-get update -qq
          ALSA=$(apt-cache show libasound2t64 >/dev/null 2>&1 && echo libasound2t64 || echo libasound2)
          sudo apt-get install -y -qq \
            libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$ALSA" \
            libxss1 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libcups2 libdrm2 ffmpeg

      - name: Install render packages
        working-directory: roblox-shorts
        run: npm ci --no-audit --no-fund

      - name: Ensure Chrome for Puppeteer
        working-directory: roblox-shorts
        run: npx puppeteer browsers install chrome

      - name: Render segment ${{ matrix.seg.seg }} (${{ matrix.seg.from }}s to ${{ matrix.seg.to }}s)
        id: render
        working-directory: roblox-shorts
        run: |
          START=$(date +%s)
          node render.mjs video --from ${{ matrix.seg.from }} --until ${{ matrix.seg.to }} --out out/seg-${{ matrix.seg.seg }}.mp4 --silent
          cp out/sfx-events.json out/sfx-events-${{ matrix.seg.seg }}.json
          echo "render_seconds=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"

      - name: Upload segment ${{ matrix.seg.seg }}
        uses: actions/upload-artifact@v4
        with:
          name: seg-video-${{ matrix.seg.seg }}
          path: |
            roblox-shorts/out/seg-${{ matrix.seg.seg }}.mp4
            roblox-shorts/out/sfx-events-${{ matrix.seg.seg }}.json
          retention-days: 14
          if-no-files-found: error

  stitch:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: roblox-shorts/package-lock.json

      - name: Install browser system libraries
        run: |
          sudo apt-get update -qq
          ALSA=$(apt-cache show libasound2t64 >/dev/null 2>&1 && echo libasound2t64 || echo libasound2)
          sudo apt-get install -y -qq \
            libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$ALSA" \
            libxss1 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libcups2 libdrm2 ffmpeg

      - name: Install render packages
        working-directory: roblox-shorts
        run: npm ci --no-audit --no-fund

      - name: Download all segments
        uses: actions/download-artifact@v4
        with:
          pattern: seg-video-*
          merge-multiple: true
          path: artifacts

      - name: Stitch video + soundtrack
        working-directory: roblox-shorts
        run: node audio/stitch.mjs ../artifacts out/video.mp4

      - name: Verify output
        working-directory: roblox-shorts
        run: |
          ls -lh out/video.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,sample_rate,channels \
            -of default=nw=1 out/video.mp4

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: sorry-bread-vertical-mp4
          path: |
            roblox-shorts/out/video.mp4
            roblox-shorts/out/sfx-plan.json
          retention-days: 30
          if-no-files-found: error
