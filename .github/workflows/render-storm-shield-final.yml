name: Render Storm-Shield Final (single full 1080x1920 render with audio)

on:
  workflow_dispatch:
  push:
    branches: [render/sorry-bread]
    paths:
      - '.github/workflows/render-storm-shield-final.yml'

concurrency:
  group: storm-shield-final
  cancel-in-progress: false

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: roblox-shorts/package-lock.json

      - name: Install browser libraries and ffmpeg
        run: |
          sudo apt-get update -qq
          ALSA=$(apt-cache show libasound2t64 >/dev/null 2>&1 && echo libasound2t64 || echo libasound2)
          sudo apt-get install -y -qq \
            libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 "$ALSA" \
            libxss1 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 libcups2 libdrm2 ffmpeg

      - name: Install render packages
        working-directory: roblox-shorts
        run: npm ci --no-audit --no-fund

      - name: Install Chrome
        working-directory: roblox-shorts
        run: npx puppeteer browsers install chrome

      - name: Select storm-shield story and generate its voice
        working-directory: roblox-shorts
        run: |
          cp stories/storm-shield.json story.json
          node voice.mjs make --provider free --speed 1.06

      - name: Check story and scene
        working-directory: roblox-shorts
        run: node render.mjs check

      - name: Preflight every story beat
        working-directory: roblox-shorts
        run: |
          TIMES=$(node -e '
            const t = require("./voice/timing.json"), lines = t.lines ?? t;
            const xs = [];
            for (const l of lines) {
              const s = l.start ?? l.begin ?? 0, e = l.end ?? (s + (l.dur ?? 0));
              if (s > 0.05) xs.push(s - 0.17);
              xs.push(s + 0.15, (s + e) / 2, e - 0.15);
            }
            console.log([...new Set(xs.map(x => Math.max(0, x).toFixed(2)))].join(","));
          ')
          set +e
          node render.mjs stills "$TIMES" > preflight.log 2>&1
          STATUS=$?
          set -e
          tail -40 preflight.log
          if [ "$STATUS" -ne 0 ]; then exit "$STATUS"; fi
          if grep -Eq 'ISSUE|CLIP|REFUSED|MOVED:' preflight.log; then
            grep -E 'ISSUE|CLIP|REFUSED|MOVED:' preflight.log | tail -120
            exit 1
          fi
          echo "Preflight passed: all story beats are clear."

      - name: Render the complete video once, with audio
        working-directory: roblox-shorts
        run: node render.mjs video --out out/storm-shield-final.mp4

      - name: Verify final video
        working-directory: roblox-shorts
        run: |
          VIDEO=out/storm-shield-final.mp4
          field() {
            ffprobe -v error -select_streams "$1" -show_entries "stream=$2" -of csv=p=0 "$VIDEO" 2>/dev/null | head -n 1 | tr -d '[:space:]'
          }
          VCODEC=$(field v:0 codec_name)
          ACODEC=$(field a:0 codec_name)
          WIDTH=$(field v:0 width)
          HEIGHT=$(field v:0 height)
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO" 2>/dev/null | head -n 1 | tr -d '[:space:]')
          echo "codecs: ${VCODEC}/${ACODEC}; size: ${WIDTH}x${HEIGHT}; duration: ${DURATION}s"
          [ "$VCODEC" = "h264" ] || { echo "bad video codec: $VCODEC"; exit 1; }
          [ "$ACODEC" = "aac" ] || { echo "bad audio codec: $ACODEC"; exit 1; }
          [ "$WIDTH" = "1080" ] || { echo "bad width: $WIDTH"; exit 1; }
          [ "$HEIGHT" = "1920" ] || { echo "bad height: $HEIGHT"; exit 1; }
          awk -v d="$DURATION" 'BEGIN { if (d < 85 || d > 92) exit 1 }' || { echo "bad duration: $DURATION"; exit 1; }
          echo "Verified: 1080x1920, H.264, AAC, ${DURATION}s."

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: storm-shield-final-1080x1920-mp4
          path: |
            roblox-shorts/out/storm-shield-final.mp4
            roblox-shorts/out/sfx-plan.json
            roblox-shorts/preflight.log
          retention-days: 30
          if-no-files-found: error
