name: Render In This Town - Cake Lamp
on:
  workflow_dispatch:
  push:
concurrency:
  group: in-this-town-cake-lamp
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender, FFmpeg and Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip python3-numpy xz-utils libegl1 libgl1 libglx-mesa0 libx11-6 libxrender1 libxi6 libxfixes3 libxkbcommon0 libwayland-client0
          curl -fsSL https://download.blender.org/release/Blender4.5/blender-4.5.17-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo "/tmp/blender-4.5.17-linux-x64" >> "$GITHUB_PATH"
          echo "BLENDER=/tmp/blender-4.5.17-linux-x64/blender" >> "$GITHUB_ENV"
          python3 -m pip install --break-system-packages -r in-this-town/requirements.txt
          BLENDER_PYTHONPATH=$(python3 -c "import numpy,os; print(os.path.dirname(os.path.dirname(numpy.__file__)))")
          BLENDER_BASE=/tmp/blender-4.5.17-linux-x64/4.5/python/lib
          BLENDER_PYVER=$(find "$BLENDER_BASE" -maxdepth 1 -type d -name 'python*' -printf '%f\n' | head -1)
          test -n "$BLENDER_PYVER" || { echo "Blender embedded Python not found"; exit 1; }
          echo "PYTHONPATH=$BLENDER_PYTHONPATH:$BLENDER_BASE/$BLENDER_PYVER/site-packages" >> "$GITHUB_ENV"
          /tmp/blender-4.5.17-linux-x64/blender -b --python-expr 'import numpy, bpy; bpy.ops.import_scene.fbx(filepath="in-this-town/assets/roblox/R15_Block.fbx"); print("Preflight OK: Blender", bpy.app.version_string, "NumPy", numpy.__version__, "FBX objects", len(bpy.context.scene.objects))'
          sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation
          sudo mkdir -p /usr/share/fonts/truetype/msttcorefonts
          sudo ln -sf /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf /usr/share/fonts/truetype/msttcorefonts/seguibl.ttf
      - name: Render video with voice, music and SFX
        working-directory: in-this-town
        env:
          PLANET_CHUNK: 150
          PLANET_COOL: 5
        run: |
          sed -i 's#"blender":"blender"#"blender":"/tmp/blender-4.5.17-linux-x64/blender"#' config.json
          python3 town/make.py town/stories/cake_lamp.json
      - name: Verify final MP4
        run: |
          ls -lh in-this-town/town/build/cake_lamp/FINAL.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,sample_rate,channels -of default=nw=1 in-this-town/town/build/cake_lamp/FINAL.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: in-this-town-cake-lamp
          path: |
            in-this-town/town/build/cake_lamp/FINAL.mp4
            in-this-town/town/build/cake_lamp/FINAL.credits.txt
            in-this-town/town/stories/cake_lamp.upload.txt
          retention-days: 14
